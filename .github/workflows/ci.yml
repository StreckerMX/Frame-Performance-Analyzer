name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FrameViewAnalyzer.sln

      - name: Build (Release)
        run: dotnet build FrameViewAnalyzer.sln --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test FrameViewAnalyzer.sln --configuration Release --no-build
