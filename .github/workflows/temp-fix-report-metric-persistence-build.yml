name: Temporary report preference build fix

on:
  push:
    branches:
      - experiment/export-report-grid
    paths:
      - tools/.trigger-report-preference-build-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/export-report-grid
          fetch-depth: 0

      - name: Qualify IOException in MainWindow
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/FrameViewAnalyzer.App/MainWindow.xaml.cs")
          text = path.read_text(encoding="utf-8-sig")
          old = "catch (Exception error) when (error is IOException or UnauthorizedAccessException)"
          new = "catch (Exception error) when (error is System.IO.IOException or UnauthorizedAccessException)"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one unqualified IOException catch, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8-sig")

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f tools/.trigger-report-preference-build-fix
          rm -f .github/workflows/temp-fix-report-metric-persistence-build.yml
          git config user.name "Strecker"
          git config user.email "101173645+StreckerMX@users.noreply.github.com"
          git add src/FrameViewAnalyzer.App/MainWindow.xaml.cs tools/.trigger-report-preference-build-fix .github/workflows/temp-fix-report-metric-persistence-build.yml
          git commit -m "fix: qualify report preference IO exception"
          git push origin HEAD:experiment/export-report-grid
