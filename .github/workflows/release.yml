name: Release

on:
  push:
    branches: [main]
    paths:
      - Directory.Build.props
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "VersionPrefix is missing from Directory.Build.props"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $zip = "artifacts/release/FramePerformanceAnalyzer-v$env:VERSION-win-x64.zip"
          $checksum = "$zip.sha256"

          if (-not (Test-Path $zip)) {
            throw "Release ZIP was not produced: $zip"
          }
          if (-not (Test-Path $checksum)) {
            throw "Release checksum was not produced: $checksum"
          }

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists; leaving it unchanged."
            exit 0
          }

          gh release create $env:TAG $zip $checksum `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Frame Performance Analyzer $env:VERSION" `
            --generate-notes

          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
