<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Frame Performance Analyzer</title>
  <desc id="desc">Animated Frame Performance Analyzer header with application logo, product slogan, workflow summary, and subtle green scans.</desc>
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76B900" stop-opacity="0"/>
      <stop offset=".30" stop-color="#76B900" stop-opacity=".018"/>
      <stop offset=".50" stop-color="#76B900" stop-opacity=".15"/>
      <stop offset=".70" stop-color="#76B900" stop-opacity=".018"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,monospace}.fg{fill:#F4F6F8}.muted{fill:#A5AFB9}.green{fill:#76B900}.cyan{fill:#00D4FF}.hero{font-size:66px;font-weight:720}.slogan{font-size:27px;font-weight:500}.sub{font-size:19px;letter-spacing:.1em}.pr{font-size:20px;font-weight:650}.code{font-size:18px}
    </style>
    <clipPath id="c1"><rect x="370" y="148" width="0" height="92"><animate attributeName="width" from="0" to="960" begin="1.65s" dur="1.15s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="370" y="250" width="0" height="46"><animate attributeName="width" from="0" to="620" begin="2.95s" dur="1.05s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="370" y="315" width="0" height="42"><animate attributeName="width" from="0" to="920" begin="4.15s" dur="1.25s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="370" y="420" width="0" height="43"><animate attributeName="width" from="0" to="250" begin="5.55s" dur=".65s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="402" y="468" width="0" height="43"><animate attributeName="width" from="0" to="900" begin="6.35s" dur="1.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="370" y="548" width="0" height="43"><animate attributeName="width" from="0" to="300" begin="7.85s" dur=".75s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="402" y="596" width="0" height="43"><animate attributeName="width" from="0" to="690" begin="8.75s" dur="1.05s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1440" height="760" rx="34" fill="#000000"/>
  <rect x="2" y="2" width="1436" height="756" rx="32" fill="none" stroke="#76B900" stroke-opacity=".10" stroke-width="2"/>

  <g>
    <rect y="-240" width="1440" height="240" fill="url(#scan)">
      <animate attributeName="y" from="-240" to="1000" dur="12s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect y="-240" width="1440" height="240" fill="url(#scan)">
      <animate attributeName="y" from="-240" to="1000" dur="12s" begin="-6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".15s" dur=".35s" fill="freeze"/>
    <rect x="105" y="130" width="190" height="190" rx="38" fill="#171B22" stroke="#343B44" stroke-width="5"/>
    <text x="135" y="282" class="sans fg" font-size="154" font-weight="720">F</text>
  </g>
  <path d="M184 273 L219 236 L246 250 L282 196" fill="none" stroke="#76B900" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin=".55s" dur="1.0s" fill="freeze"/>
  </path>

  <text x="370" y="220" class="sans fg hero" clip-path="url(#c1)">Frame Performance Analyzer</text>
  <text x="370" y="282" class="sans green slogan" clip-path="url(#c2)">Analyze. Compare. Understand performance.</text>
  <text x="370" y="346" class="mono muted sub" clip-path="url(#c3)">WINDOWS / NVIDIA FRAMEVIEW / NVIDIA APP / PERFORMANCE ANALYSIS</text>

  <text x="370" y="452" class="mono cyan pr" clip-path="url(#c4)">❯ input --supported</text>
  <text x="402" y="500" class="mono muted code" clip-path="url(#c5)">NVIDIA FrameView captures · NVIDIA App performance logs</text>
  <text x="370" y="580" class="mono cyan pr" clip-path="url(#c6)">❯ workflow --current</text>
  <text x="402" y="628" class="mono green code" clip-path="url(#c7)">analyze · compare · isolate · visualize · export</text>
</svg>
