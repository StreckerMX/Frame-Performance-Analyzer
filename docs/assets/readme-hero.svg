<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Strecker developer hero</title>
  <desc id="desc">Animated Strecker header with logo, developer focus, terminal-style status text, and subtle green scans.</desc>
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76B900" stop-opacity="0"/>
      <stop offset=".30" stop-color="#76B900" stop-opacity=".018"/>
      <stop offset=".50" stop-color="#76B900" stop-opacity=".15"/>
      <stop offset=".70" stop-color="#76B900" stop-opacity=".018"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,monospace}.fg{fill:#F4F6F8}.muted{fill:#A5AFB9}.green{fill:#76B900}.cyan{fill:#00D4FF}.hero{font-size:72px;font-weight:720}.sub{font-size:21px;letter-spacing:.1em}.lead{font-size:24px}.pr{font-size:20px;font-weight:650}.code{font-size:18px}
    </style>
    <clipPath id="c1"><rect x="340" y="138" width="0" height="110"><animate attributeName="width" from="0" to="460" begin="1.9s" dur=".95s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="340" y="274" width="0" height="43"><animate attributeName="width" from="0" to="980" begin="3.0s" dur="1.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="340" y="331" width="0" height="43"><animate attributeName="width" from="0" to="850" begin="4.5s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="340" y="421" width="0" height="43"><animate attributeName="width" from="0" to="170" begin="5.8s" dur=".6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="372" y="469" width="0" height="43"><animate attributeName="width" from="0" to="820" begin="6.55s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="340" y="537" width="0" height="43"><animate attributeName="width" from="0" to="260" begin="7.95s" dur=".7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="372" y="585" width="0" height="43"><animate attributeName="width" from="0" to="620" begin="8.8s" dur="1.0s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1440" height="760" rx="34" fill="#000000"/>
  <rect x="2" y="2" width="1436" height="756" rx="32" fill="none" stroke="#76B900" stroke-opacity=".10" stroke-width="2"/>

  <g>
    <rect y="-240" width="1440" height="240" fill="url(#scan)">
      <animate attributeName="y" from="-240" to="1000" dur="12s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect y="-240" width="1440" height="240" fill="url(#scan)">
      <animate attributeName="y" from="-240" to="1000" dur="12s" begin="-6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M290 130L276 147L262 160L247 169L229 178L228 120L220 120L188 139L154 121L147 121L146 178L121 167L100 151L109 172L118 186L141 199L130 199L146 213L170 212L170 214L157 220L172 228L194 234L220 225L240 212L218 206L217 204L241 202L255 199L269 183L255 182L275 173L283 155Z" fill="#76B900" fill-opacity="0" stroke="#76B900" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin=".25s" dur="1.55s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="1.7s" dur=".35s" fill="freeze"/>
  </path>

  <text x="340" y="220" class="sans fg hero" clip-path="url(#c1)">Strecker</text>
  <text x="340" y="305" class="mono muted sub" clip-path="url(#c2)">WINDOWS SOFTWARE / PERFORMANCE / AUTOMATION / LOCAL AI</text>
  <text x="340" y="362" class="sans muted lead" clip-path="url(#c3)">Practical software. Measurable performance. Clear interfaces.</text>
  <text x="340" y="452" class="mono cyan pr" clip-path="url(#c4)">❯ whoami</text>
  <text x="372" y="500" class="mono muted code" clip-path="url(#c5)">developer building fast, practical desktop tools and technical workflows</text>
  <text x="340" y="568" class="mono cyan pr" clip-path="url(#c6)">❯ status --current</text>
  <text x="372" y="616" class="mono green code" clip-path="url(#c7)">building · measuring · refining · shipping</text>
</svg>
